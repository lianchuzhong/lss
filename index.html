<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #8a93a6;
      --accent: #3b82f6;
      --accent-dark: #2563eb;
      --danger: #ef4444;
      --border: #e5e9f2;
      --other: #eef1f7;
      --green: #22c55e;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 12px 60px;
    }
    .hidden { display: none !important; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 11px 18px;
      transition: background .15s;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-dark); }
    .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--border); }
    .btn.ghost:hover { background: #eff6ff; border-color: var(--accent); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.block { width: 100%; }

    .wrap { width: min(100%, 880px); margin: 0 auto; }

    .hero { text-align: center; margin: 12px 0 26px; }
    .hero h1 { font-size: 28px; letter-spacing: 1px; }
    .hero .sub { color: var(--muted); font-size: 14px; margin-top: 10px; line-height: 1.7; }

    /* form card */
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(31, 41, 55, .12);
      padding: 26px 26px;
      margin-bottom: 26px;
    }
    .card label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
    .card label:first-child { margin-top: 0; }
    .card input[type="text"],
    .card input[type="number"],
    .card textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    .card textarea { resize: vertical; min-height: 74px; }
    .card input:focus, .card textarea:focus { border-color: var(--accent); }

    .upload {
      margin-top: 14px;
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
    }
    .upload:hover { border-color: var(--accent); background: #eff6ff; }
    .upload .u-icon { font-size: 26px; display: block; margin-bottom: 6px; }
    .upload input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .preview .file {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #0f1420;
      min-width: 140px;
    }
    .preview .file video, .preview .file img { display: block; max-width: 260px; max-height: 170px; object-fit: contain; }
    .preview .file .name { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(15, 20, 32, .72); color: #fff; font-size: 11px; padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview .file .x {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,.55); color: #fff; border: none; cursor: pointer; font-size: 13px; line-height: 1;
    }

    .form-row { display: flex; gap: 12px; }
    .form-row > div { flex: 1; }

    .submit-wrap { margin-top: 18px; }
    .status-bar { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: center; }
    .status-bar .ok { color: var(--green); }
    .status-bar .err { color: var(--danger); }

    .badge-on { display: inline-block; background: #def7ec; color: #0a7a3d; font-size: 12px; padding: 4px 12px; border-radius: 20px; margin-top: 8px; }

    /* posts */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .section-title .cnt {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      background: var(--other);
      padding: 2px 10px;
      border-radius: 20px;
    }
    .refresh { margin-left: auto; font-size: 12px; padding: 7px 12px; }
    .owner-link { font-size: 12px; padding: 7px 12px; }

    /* owner modal */
    .owner-modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .owner-mask { position: absolute; inset: 0; background: rgba(15, 20, 32, .5); }
    .owner-card {
      position: relative;
      background: var(--card);
      width: min(100%, 520px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(15, 20, 32, .35);
    }
    .owner-card h3 { margin-bottom: 10px; }
    .owner-card .owner-tip { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
    .owner-card textarea {
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      resize: vertical;
      outline: none;
    }
    .owner-card textarea:focus { border-color: var(--accent); }
    .owner-btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .owner-btns .btn { flex: 1; }
    .owner-btns label.btn { display: inline-flex; align-items: center; justify-content: center; }
    .owner-card .status-bar { text-align: left; color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 12px; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 44px 0;
      background: var(--card);
      border-radius: 16px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .post {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(31, 41, 55, .10);
      display: flex;
      flex-direction: column;
    }
    .post .media { background: #0f1420; position: relative; }
    .post .media video, .post .media img { display: block; width: 100%; height: 190px; object-fit: cover; }
    .post .media video { object-fit: contain; background: #0f1420; }
    .post .media .tag {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,.55); color: #fff; font-size: 11px;
      padding: 3px 9px; border-radius: 20px;
    }
    .post .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .post .price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    .post .contact {
      font-size: 13px;
      color: var(--text);
      background: var(--other);
      border-radius: 8px;
      padding: 7px 10px;
      word-break: break-all;
    }
    .post .msg {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }
    .post .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; }
    .post .meta .name { font-weight: 600; color: var(--text); margin-right: auto; }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2430;
      color: #fff;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 100;
      max-width: 90vw;
    }
    #toast.show { opacity: 1; }

    .modal { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-mask { position: absolute; inset: 0; background: rgba(15, 20, 32, .55); }
    .modal-card {
      position: relative;
      background: var(--card);
      width: min(100%, 380px);
      border-radius: 16px;
      padding: 26px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(15, 20, 32, .35);
    }
    .modal-title { font-size: 17px; font-weight: 700; }
    .modal-no { margin: 16px 0 10px; font-size: 14px; color: var(--text); }
    .modal-no b { font-size: 30px; color: var(--accent); letter-spacing: 1px; }
    .modal-thanks { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; }

    @media (max-width: 520px) {
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>留言板</h1>
      <div class="sub">上传视频或图片，写明价格与联系方式。留言内容会在浏览器中加密后安全保存，只有站长可以查看。</div>
      <div class="badge-on" id="msgCount" style="display:none">留言加载中…</div>
    </div>

    <!-- 发布表单 -->
    <div class="card">
      <label>昵称（可选）</label>
      <input id="name" type="text" maxlength="20" placeholder="例如：老范" autocomplete="off">

      <div class="upload" id="drop">
        <span class="u-icon">📤</span>
        点击选择或拖入 1 个视频或图片（支持 mp4 / jpg / png 等，单个最大约 90MB）
        <input id="file" type="file" accept="image/*,video/*">
      </div>
      <div class="preview" id="preview"></div>

      <div class="form-row">
        <div>
          <label for="price">价格（可选，单位：元）</label>
          <input id="price" type="number" min="0" step="0.01" placeholder="例如：500">
        </div>
        <div>
          <label for="contact">联系方式（微信 / 电话）</label>
          <input id="contact" type="text" maxlength="60" placeholder="例如：微信 abc123">
        </div>
      </div>

      <label for="message">留言内容</label>
      <textarea id="message" maxlength="1000" placeholder="简单介绍一下这个视频/图片，以及有什么要求…"></textarea>

      <div class="submit-wrap">
        <button id="submit" class="btn primary block">提交留言</button>
        <div class="status-bar" id="status"></div>
      </div>
    </div>

    </div>

  <div id="toast"></div>

  <div class="modal hidden" id="successModal">
    <div class="modal-mask" data-close="1"></div>
    <div class="modal-card">
      <div class="modal-title">留言提交成功 🎉</div>
      <div class="modal-no">您的留言编号<br><b id="succNo">#1</b></div>
      <div class="modal-thanks">感谢您对本站的支持！<br>站长会尽快查看您的留言。</div>
      <button id="succOk" class="btn primary block">好的，收到</button>
    </div>
  </div>

  <script src="./bundle.js?v=7"></script>
</body>
</html>
